name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: "Ludo World"
  APP_ID: "com.ludoworld.game"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/admob@7
          mkdir -p www
          cp "$(ls *.html | head -n 1)" www/index.html
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android

      - name: Generate app icon and splash
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash.png assets/splash-dark.png
          npx @capacitor/assets@3 generate --android

      - name: Add AdMob App ID and sync
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-world-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
